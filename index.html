<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>出國購物清單</title>
  <meta name="theme-color" content="#1b2a58">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="購物清單">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="top"></header>
  <main id="view"></main>
  <button id="add-button" class="fab" type="button" data-action="add-item" aria-label="新增品項">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav id="tabs" aria-label="主要分頁">
    <button type="button" data-action="tab" data-tab="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span>清單</span>
    </button>
    <button type="button" data-action="tab" data-tab="stores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v10h16V10M3 10l2-6h14l2 6M3 10h18M10 20v-5h4v5"/></svg>
      <span>店家</span>
    </button>
    <button type="button" data-action="tab" data-tab="spend">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v17l-3-2-2 2-2-2-2 2-2-2-3 2zM9 9h6M9 13h6"/></svg>
      <span>花費</span>
    </button>
    <button type="button" data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      <span>設定</span>
    </button>
  </nav>
  <dialog id="sheet" class="sheet"></dialog>
  <dialog id="clerk" class="clerk"></dialog>
  <dialog id="photo" class="viewer"></dialog>
  <dialog id="confirm" class="confirm"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <input id="import-input" type="file" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
